<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="p2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09141B"/>
      <stop offset="100%" stop-color="#11222E"/>
    </linearGradient>
    <filter id="p2Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#p2Bg)"/>

  <!-- Browser Header -->
  <rect width="800" height="42" fill="#0E1C26" rx="16 16 0 0"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10B981" opacity="0.8"/>
  <rect x="90" y="9" width="340" height="24" rx="12" fill="#162936"/>
  <text x="110" y="25" fill="#94A3B8" font-family="monospace" font-size="11">https://infra-webgis.internal/ores-network/map</text>
  <rect x="670" y="10" width="105" height="22" rx="11" fill="rgba(115,209,156,0.15)" stroke="#73D19C" stroke-width="1"/>
  <circle cx="682" cy="21" r="3.5" fill="#73D19C"/>
  <text x="692" y="25" fill="#73D19C" font-family="system-ui, sans-serif" font-size="10" font-weight="700">GIF PREVIEW</text>

  <!-- Stylized Dark Carto WebGIS Tile Base -->
  <g opacity="0.3">
    <!-- Coastline / Water Body -->
    <path d="M 0 380 Q 200 320 400 390 T 800 340 L 800 480 L 0 480 Z" fill="#0C2533"/>
    <!-- Land parcel blocks -->
    <rect x="80" y="70" width="110" height="80" rx="4" fill="#152633"/>
    <rect x="210" y="70" width="140" height="70" rx="4" fill="#152633"/>
    <rect x="370" y="80" width="160" height="60" rx="4" fill="#152633"/>
    <rect x="100" y="180" width="140" height="90" rx="4" fill="#152633"/>
    <rect x="260" y="170" width="180" height="110" rx="4" fill="#152633"/>
    <rect x="460" y="170" width="120" height="90" rx="4" fill="#152633"/>
  </g>

  <!-- Multi-Utility Infrastructure Networks (Gas / Electric / Telecom) -->
  <!-- Gas Network (Yellow) -->
  <path d="M 40 160 L 250 160 L 250 310 L 460 310 L 460 140 L 720 140" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Electric High-Voltage (Magenta/Cyan) -->
  <path d="M 80 420 L 200 240 L 370 240 L 520 100 L 760 100" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Telecom Optical Trunk (Mergin Green) -->
  <path d="M 50 100 L 320 100 L 320 280 L 640 280 L 760 380" stroke="#73D19C" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#p2Glow)"/>

  <!-- Interactive Map Controls (Top Right) -->
  <g transform="translate(730, 60)">
    <rect width="36" height="76" rx="8" fill="#10202B" stroke="#253846" stroke-width="1.5"/>
    <text x="18" y="26" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">+</text>
    <line x1="8" y1="38" x2="28" y2="38" stroke="#253846" stroke-width="1"/>
    <text x="18" y="60" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">−</text>
  </g>

  <!-- Interactive Feature Inspection Popup (Web GIS) -->
  <g transform="translate(300, 180)">
    <!-- Popup Anchor Pin -->
    <path d="M 20 120 L 25 140 L 30 120 Z" fill="#10202B"/>
    <!-- Popup Card -->
    <rect width="260" height="125" rx="10" fill="#10202B" stroke="#73D19C" stroke-width="1.5"/>
    <rect width="260" height="28" rx="10 10 0 0" fill="#19303F"/>
    <text x="12" y="19" fill="#73D19C" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⚡ Asset Node #BE-9042</text>
    
    <text x="12" y="48" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Type: <tspan fill="#FFFFFF">Underground Telecom Chamber</tspan></text>
    <text x="12" y="66" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Network: <tspan fill="#73D19C">ORES Telecom Trunk</tspan></text>
    <text x="12" y="84" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Status: <tspan fill="#34D399">Verified (QA Audit 100%)</tspan></text>
    <text x="12" y="102" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Coordinates: <tspan fill="#38BDF8">50.8503° N, 4.3517° E</tspan></text>
  </g>

  <!-- Layer Switcher Panel (Left Side) -->
  <g transform="translate(24, 60)">
    <rect width="180" height="150" rx="10" fill="#0C1720" stroke="#1E3240" stroke-width="1.5" opacity="0.95"/>
    <text x="12" y="24" fill="#73D19C" font-family="system-ui, sans-serif" font-size="11" font-weight="700">MAP LAYERS</text>
    
    <!-- Layer 1 -->
    <circle cx="18" cy="48" r="5" fill="#73D19C"/>
    <text x="30" y="52" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">Telecom Routes</text>

    <!-- Layer 2 -->
    <circle cx="18" cy="74" r="5" fill="#06B6D4"/>
    <text x="30" y="78" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">Electric Power Grid</text>

    <!-- Layer 3 -->
    <circle cx="18" cy="100" r="5" fill="#FBBF24"/>
    <text x="30" y="104" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="10">Gas Infrastructure</text>

    <!-- Layer 4 -->
    <circle cx="18" cy="126" r="5" fill="#94A3B8"/>
    <text x="30" y="130" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="10">Cadastral Parcels</text>
  </g>

  <!-- Live Scale & Attribution -->
  <g transform="translate(24, 445)">
    <text x="0" y="16" fill="#64748B" font-family="system-ui, sans-serif" font-size="10">Leaflet / MapLibre GL • PostGIS API • GeoServer Vector Tiles</text>
  </g>
</svg>

