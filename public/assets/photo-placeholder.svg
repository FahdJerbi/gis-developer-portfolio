<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAF9"/>
      <stop offset="50%" stop-color="#EFF6F2"/>
      <stop offset="100%" stop-color="#E2ECE6"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#73D19C"/>
      <stop offset="100%" stop-color="#004C45"/>
    </linearGradient>
    <pattern id="geoGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(0, 76, 69, 0.06)" stroke-width="1"/>
      <circle cx="36" cy="36" r="1.5" fill="rgba(0, 76, 69, 0.12)"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="700" rx="20" fill="url(#bgGrad)"/>
  <rect width="600" height="700" rx="20" fill="url(#geoGrid)"/>

  <!-- Topographic Contour Lines -->
  <path d="M -50 150 C 150 100, 250 220, 650 140" stroke="rgba(0, 76, 69, 0.12)" stroke-width="1.5" fill="none"/>
  <path d="M -50 250 C 180 180, 320 320, 650 240" stroke="rgba(0, 76, 69, 0.14)" stroke-width="1.5" fill="none"/>
  <path d="M -50 380 C 120 300, 380 440, 650 360" stroke="rgba(0, 76, 69, 0.1)" stroke-width="1.5" fill="none"/>
  <path d="M -50 500 C 220 420, 350 560, 650 480" stroke="rgba(0, 76, 69, 0.12)" stroke-width="1.5" fill="none"/>

  <!-- Coordinates & Crosshairs -->
  <g opacity="0.4">
    <path d="M 60 60 L 80 60 M 60 60 L 60 80" stroke="#004C45" stroke-width="2"/>
    <path d="M 540 60 L 520 60 M 540 60 L 540 80" stroke="#004C45" stroke-width="2"/>
    <path d="M 60 640 L 80 640 M 60 640 L 60 620" stroke="#004C45" stroke-width="2"/>
    <path d="M 540 640 L 520 640 M 540 640 L 540 620" stroke="#004C45" stroke-width="2"/>
  </g>

  <!-- Central Avatar Silhouette / Spatial Portal -->
  <g transform="translate(300, 310)">
    <!-- Outer Ring -->
    <circle cx="0" cy="0" r="125" fill="none" stroke="rgba(0, 76, 69, 0.18)" stroke-width="2" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="110" fill="#FFFFFF" stroke="url(#accentGlow)" stroke-width="3"/>

    <!-- Silhouette Head & Shoulders -->
    <circle cx="0" cy="-28" r="44" fill="#CBD5E1"/>
    <path d="M -72 82 C -72 35, -42 16, 0 16 C 42 16, 72 35, 72 82 Z" fill="#CBD5E1"/>

    <!-- Spatial Marker Icon on Badge -->
    <circle cx="44" cy="44" r="25" fill="#004C45" stroke="#73D19C" stroke-width="2"/>
    <path d="M 44 32 C 38.5 32, 34 36.5, 34 42 C 34 48.5, 44 58, 44 58 C 44 58, 54 48.5, 54 42 C 54 36.5, 49.5 32, 44 32 Z" fill="#73D19C"/>
    <circle cx="44" cy="41" r="3" fill="#004C45"/>
  </g>

  <!-- Label and Callout -->
  <g transform="translate(300, 520)" text-anchor="middle">
    <!-- Pill Container -->
    <rect x="-135" y="-18" width="270" height="36" rx="18" fill="#FFFFFF" stroke="#004C45" stroke-width="1.5"/>
    <text x="0" y="5" fill="#004C45" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">PHOTO PLACEHOLDER</text>
    
    <text x="0" y="44" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12">Drop photo: public/assets/fahd-jerbi.jpg</text>
    <text x="0" y="70" fill="#004C45" font-family="monospace" font-size="11" font-weight="600" letter-spacing="0.5">36°48'23"N 10°10'54"E • TUNIS</text>
  </g>
</svg>
