<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="p1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1720"/>
      <stop offset="100%" stop-color="#16232D"/>
    </linearGradient>
    <linearGradient id="p1Green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73D19C"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="p1Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#p1Bg)"/>

  <!-- QGIS Top App Bar -->
  <rect width="800" height="42" fill="#121B24" rx="16 16 0 0"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10B981" opacity="0.8"/>
  <text x="90" y="26" fill="#94A3B8" font-family="monospace" font-size="12">QGIS Desktop 3.34 - FTTH Auto-Design Plugin [PyQGIS / PyQt6]</text>
  <rect x="670" y="10" width="105" height="22" rx="11" fill="rgba(115,209,156,0.15)" stroke="#73D19C" stroke-width="1"/>
  <circle cx="682" cy="21" r="3.5" fill="#73D19C"/>
  <text x="692" y="25" fill="#73D19C" font-family="system-ui, sans-serif" font-size="10" font-weight="700">GIF PREVIEW</text>

  <!-- Map Canvas Grid -->
  <g opacity="0.25">
    <path d="M 0 100 L 800 100 M 0 180 L 800 180 M 0 260 L 800 260 M 0 340 L 800 340 M 0 420 L 800 420" stroke="#73D19C" stroke-width="0.8" stroke-dasharray="4 4"/>
    <path d="M 120 42 L 120 480 M 240 42 L 240 480 M 360 42 L 360 480 M 480 42 L 480 480 M 600 42 L 600 480 M 720 42 L 720 480" stroke="#73D19C" stroke-width="0.8" stroke-dasharray="4 4"/>
  </g>

  <!-- Street Network & Vector Road Lines -->
  <path d="M 60 140 Q 240 180 420 120 T 740 190" stroke="#2C3E50" stroke-width="8" stroke-linecap="round" fill="none"/>
  <path d="M 180 80 L 260 380 L 460 420 L 680 320" stroke="#2C3E50" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- FTTH Fiber Cable Auto-Routing Animation Simulated Lines -->
  <path d="M 180 120 L 290 190 L 440 230 L 590 180 L 680 260" stroke="#73D19C" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#p1Glow)"/>
  <path d="M 290 190 L 220 280 L 340 360" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 3" fill="none"/>
  <path d="M 440 230 L 510 320 L 610 360" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 3" fill="none"/>

  <!-- Optical Distribution Points (PBO / SRO) -->
  <g>
    <!-- Central Node SRO -->
    <rect x="274" y="174" width="32" height="32" rx="8" fill="#0B1319" stroke="#73D19C" stroke-width="2"/>
    <text x="290" y="194" fill="#73D19C" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">SRO</text>

    <!-- Sub Distribution PBOs -->
    <circle cx="180" cy="120" r="10" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="440" cy="230" r="10" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="590" cy="180" r="10" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>
    <circle cx="680" cy="260" r="10" fill="#38BDF8" stroke="#FFFFFF" stroke-width="2"/>

    <!-- Customers / End Points -->
    <circle cx="220" cy="280" r="6" fill="#F43F5E"/>
    <circle cx="340" cy="360" r="6" fill="#F43F5E"/>
    <circle cx="510" cy="320" r="6" fill="#F43F5E"/>
    <circle cx="610" cy="360" r="6" fill="#F43F5E"/>
  </g>

  <!-- Floating PyQGIS Custom Dock Widget -->
  <g transform="translate(480, 240)">
    <rect width="280" height="190" rx="12" fill="#0D161F" stroke="#73D19C" stroke-width="1.5" opacity="0.95"/>
    <rect width="280" height="32" rx="12 12 0 0" fill="#152430"/>
    <text x="14" y="21" fill="#73D19C" font-family="system-ui, sans-serif" font-size="11" font-weight="700">⚡ FTTH Automation Module</text>
    
    <!-- Status lines -->
    <text x="14" y="56" fill="#94A3B8" font-family="monospace" font-size="10">Distribution Points: <tspan fill="#FFFFFF">42 Nodes</tspan></text>
    <text x="14" y="76" fill="#94A3B8" font-family="monospace" font-size="10">Auto-routes Generated: <tspan fill="#34D399">128 Lines</tspan></text>
    <text x="14" y="96" fill="#94A3B8" font-family="monospace" font-size="10">Splicing Report: <tspan fill="#38BDF8">DOE_Belgique.xlsx</tspan></text>

    <!-- Progress bar -->
    <rect x="14" y="115" width="252" height="8" rx="4" fill="#1E293B"/>
    <rect x="14" y="115" width="220" height="8" rx="4" fill="url(#p1Green)"/>

    <!-- Action button -->
    <rect x="14" y="140" width="120" height="30" rx="6" fill="#73D19C"/>
    <text x="74" y="160" fill="#0B1319" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓ Export Splicing</text>

    <rect x="146" y="140" width="120" height="30" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="206" y="160" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Verify Rules</text>
  </g>

  <!-- Bottom Coordinates Bar -->
  <g transform="translate(20, 445)">
    <rect width="280" height="24" rx="6" fill="rgba(11,19,25,0.7)"/>
    <text x="12" y="16" fill="#73D19C" font-family="monospace" font-size="10">CRS: EPSG:31370 (Lambert 72) • Scale 1:2500</text>
  </g>
</svg>

