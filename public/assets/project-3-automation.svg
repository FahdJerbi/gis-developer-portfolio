<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#091319"/>
      <stop offset="100%" stop-color="#141E26"/>
    </linearGradient>
    <linearGradient id="p3Green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#73D19C"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="480" rx="16" fill="url(#p3Bg)"/>

  <!-- Terminal / Automation Header -->
  <rect width="800" height="42" fill="#0D1820" rx="16 16 0 0"/>
  <circle cx="28" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="44" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="60" cy="21" r="5" fill="#10B981" opacity="0.8"/>
  <text x="90" y="26" fill="#94A3B8" font-family="monospace" font-size="12">python3 run_spatial_audit_pipeline.py --source=ORES_AutoCAD --target=PostGIS</text>
  <rect x="670" y="10" width="105" height="22" rx="11" fill="rgba(115,209,156,0.15)" stroke="#73D19C" stroke-width="1"/>
  <circle cx="682" cy="21" r="3.5" fill="#73D19C"/>
  <text x="692" y="25" fill="#73D19C" font-family="system-ui, sans-serif" font-size="10" font-weight="700">GIF PREVIEW</text>

  <!-- Pipeline Architecture Diagram Flow -->
  <g transform="translate(40, 70)">
    <!-- Stage 1: Ingestion -->
    <rect x="0" y="0" width="190" height="90" rx="10" fill="#111F2A" stroke="#233544" stroke-width="1.5"/>
    <text x="16" y="28" fill="#73D19C" font-family="monospace" font-size="11" font-weight="700">01. INGESTION</text>
    <text x="16" y="52" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">AutoCAD DXF/DWG</text>
    <text x="16" y="72" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Extract vector geometries</text>

    <!-- Arrow 1 to 2 -->
    <path d="M 195 45 L 255 45" stroke="#73D19C" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="255,41 265,45 255,49" fill="#73D19C"/>

    <!-- Stage 2: Spatial QA/QC & Topology -->
    <rect x="270" y="0" width="200" height="90" rx="10" fill="#111F2A" stroke="#73D19C" stroke-width="1.5"/>
    <text x="16" y="28" transform="translate(270,0)" fill="#73D19C" font-family="monospace" font-size="11" font-weight="700">02. TOPOLOGY QA/QC</text>
    <text x="16" y="52" transform="translate(270,0)" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Shapely + GDAL Audit</text>
    <text x="16" y="72" transform="translate(270,0)" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Snapping, dangles, slivers</text>

    <!-- Arrow 2 to 3 -->
    <path d="M 475 45 L 535 45" stroke="#73D19C" stroke-width="2" stroke-dasharray="4 4"/>
    <polygon points="535,41 545,45 535,49" fill="#73D19C"/>

    <!-- Stage 3: PostGIS & Reports -->
    <rect x="550" y="0" width="170" height="90" rx="10" fill="#111F2A" stroke="#233544" stroke-width="1.5"/>
    <text x="16" y="28" transform="translate(550,0)" fill="#73D19C" font-family="monospace" font-size="11" font-weight="700">03. OUTPUT</text>
    <text x="16" y="52" transform="translate(550,0)" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PostGIS / GeoPackage</text>
    <text x="16" y="72" transform="translate(550,0)" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Automated PDF / Excel</text>
  </g>

  <!-- Live Terminal Log Output Box -->
  <g transform="translate(40, 190)">
    <rect width="720" height="240" rx="10" fill="#0A1117" stroke="#1C2B38" stroke-width="1.5"/>
    
    <!-- Code / Log Lines -->
    <text x="20" y="32" fill="#73D19C" font-family="monospace" font-size="12">[INFO] 2026-09-23 11:42:01 - Initializing Spatial Audit Engine v2.4</text>
    <text x="20" y="58" fill="#94A3B8" font-family="monospace" font-size="12">[INFO] Parsing 1,842 infrastructure vector entities from CAD source layers...</text>
    <text x="20" y="84" fill="#38BDF8" font-family="monospace" font-size="12">[CHECK] Verifying topological connectivity: 1,842 / 1,842 nodes validated (0 dangles)</text>
    <text x="20" y="110" fill="#FBBF24" font-family="monospace" font-size="12">[CORRECT] Auto-repaired 3 duplicate vertex tolerances under 0.005m threshold</text>
    <text x="20" y="136" fill="#73D19C" font-family="monospace" font-size="12">[SUCCESS] Converted to PostGIS spatial table: "infrastructure_ores_belgique"</text>
    <text x="20" y="162" fill="#E2E8F0" font-family="monospace" font-size="12">[REPORT] Automated DOE compliance audit generated: "Rapport_Conformite_ORES.xlsx"</text>
    
    <!-- Progress Indicator inside terminal -->
    <rect x="20" y="190" width="680" height="26" rx="6" fill="#14212C"/>
    <rect x="20" y="190" width="640" height="26" rx="6" fill="url(#p3Green)"/>
    <text x="360" y="208" fill="#091319" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">PIPELINE EXECUTION 100% COMPLETE • 0 ERRORS DETECTED</text>
  </g>

  <!-- Bottom Coordinates Bar -->
  <g transform="translate(40, 452)">
    <text x="0" y="10" fill="#64748B" font-family="monospace" font-size="10">Python 3.11 • GDAL/OGR • GeoPandas • PostGIS • PyQGIS Processing Engine</text>
  </g>
</svg>

